name: Trigger Obsidian sync after Sveltia validation

on:
  push:
    branches:
      - main
    paths:
      - 'content/writeups/publication-control.json'
  workflow_dispatch:

jobs:
  trigger-obsidian-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger obsidan.note workflow
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.OBSIDIAN_SYNC_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hackus-mans/obsidan.note/actions/workflows/sync-projet-to-portofiolo.yml/dispatches \
            -d '{"ref":"main"}'
