backend:
  name: github
  repo: hackus-mans/portofiolo
  branch: main

media_folder: assets/uploads
public_folder: /portofiolo/assets/uploads

collections:
  - name: settings
    label: Paramètres du site
    files:
      - label: Profil
        name: profile
        file: assets/data/profile.json
        format: json
        fields:
          - { label: Nom, name: name, widget: string }
          - { label: Titre, name: title, widget: string }
          - { label: Bio courte, name: bio, widget: text }
          - { label: Texte à propos, name: about, widget: text }
          - { label: Chemin du CV, name: cv, widget: string, required: false }
          - label: Contacts
            name: contacts
            widget: list
            fields:
              - { label: Libellé, name: label, widget: string }
              - { label: Lien, name: url, widget: string }
      - label: Compétences
        name: skills
        file: assets/data/skills.json
        format: json
        fields:
          - label: Liste des compétences
            name: items
            widget: list
            fields:
              - { label: Titre, name: title, widget: string }
              - { label: Description, name: description, widget: text }
      - label: Certifications et badges
        name: certifications
        file: assets/data/certifications.json
        format: json
        fields:
          - label: Liste des éléments
            name: items
            widget: list
            fields:
              - label: Type
                name: type
                widget: select
                options:
                  - { label: Vraie certification, value: certification }
                  - { label: Badge, value: badge }
              - { label: Nom de la certification ou du badge, name: title, widget: string }
              - { label: Organisme émetteur, name: issuer, widget: string }
              - label: Statut
                name: status
                widget: select
                options:
                  - Obtenue
                  - En préparation
                  - En apprentissage
                  - Objectif
              - { label: Date ou année, name: date, widget: string, required: false }
              - { label: Image de la preuve, name: image, widget: image, required: false }
              - { label: Lien de vérification, name: credentialUrl, widget: string, required: false }
              - { label: Description, name: description, widget: text }
              - label: Compétences liées
                name: skills
                widget: list
                field: { label: Compétence, name: skill, widget: string }

  - name: realisations
    label: Réalisations
    files:
      - label: Projets, Writeups et Labs
        name: realisations
        file: assets/data/realisations.json
        format: json
        fields:
          - label: Liste des réalisations
            name: items
            widget: list
            summary: "{{fields.title}} — {{fields.type}}"
            fields:
              - label: Type
                name: type
                widget: select
                options:
                  - { label: Projet, value: project }
                  - { label: Writeup, value: writeup }
                  - { label: Lab, value: lab }
              - { label: Titre, name: title, widget: string }
              - { label: Catégorie, name: category, widget: string, hint: "Exemple : Offensive Security, Defensive Security, AI + Cybersecurity, Home Lab, CTF Web" }
              - label: Niveau
                name: level
                widget: select
                options:
                  - Débutant
                  - Intermédiaire
                  - Avancé
                  - À définir
              - label: Statut
                name: status
                widget: select
                options:
                  - En cours
                  - Terminé
                  - En amélioration
                  - À documenter
                  - Modèle
              - { label: Description courte, name: description, widget: text }
              - { label: Objectif, name: objective, widget: text }
              - { label: Problème traité, name: problem, widget: text, required: false }
              - label: Stack technique / Outils
                name: stack
                widget: list
                required: false
                field: { label: Outil, name: tool, widget: string }
              - label: Fonctionnalités principales
                name: features
                widget: list
                required: false
                field: { label: Fonctionnalité, name: feature, widget: string }
              - label: Difficultés rencontrées
                name: difficulties
                widget: list
                required: false
                field: { label: Difficulté, name: difficulty, widget: string }
              - label: Résultats obtenus
                name: results
                widget: list
                required: false
                field: { label: Résultat, name: result, widget: string }
              - label: Compétences démontrées
                name: skills
                widget: list
                required: false
                field: { label: Compétence, name: skill, widget: string }
              - label: Captures d’écran
                name: screenshots
                widget: list
                required: false
                field: { label: Image, name: image, widget: image }
              - { label: Schéma ou architecture, name: architectureImage, widget: image, required: false }
              - label: Ressources
                name: resources
                widget: list
                required: false
                fields:
                  - { label: Libellé, name: label, widget: string }
                  - { label: URL, name: url, widget: string }
                  - { label: Type, name: type, widget: string, required: false, hint: "GitHub, Rapport PDF, Démo, Documentation, Fichier" }
              - label: Blocs de code
                name: codeSnippets
                widget: list
                required: false
                fields:
                  - { label: Titre du code, name: title, widget: string }
                  - { label: Langage, name: language, widget: string, required: false, hint: "python, bash, javascript, powershell, etc." }
                  - { label: Code, name: code, widget: code, default_language: bash }
              - { label: Lien GitHub, name: github, widget: string, required: false }
              - { label: Lien démo ou rapport, name: demo, widget: string, required: false }
              - label: Documentation complète
                name: documentation
                widget: markdown
                required: false
                hint: "Écris ici comme dans Obsidian : titres, listes, explications, commandes, notes, étapes, conclusion."

  - name: articles
    label: Articles
    files:
      - label: Liste des articles
        name: articles
        file: assets/data/articles.json
        format: json
        fields:
          - label: Articles
            name: items
            widget: list
            fields:
              - { label: Titre, name: title, widget: string }
              - { label: Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
              - { label: Résumé, name: summary, widget: text }
              - { label: Lien, name: url, widget: string, required: false }
