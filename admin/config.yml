backend:
  name: github
  repo: hackus-mans/portofiolo
  branch: main

media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: settings
    label: Paramètres du site
    files:
      - label: Profil
        name: profile
        file: assets/data/profile.json
        format: json
        fields:
          - { label: Nom, name: name, widget: string }
          - { label: Titre, name: title, widget: string }
          - { label: Photo de profil, name: image, widget: image, required: false, hint: "Ajoute ici ta photo. Elle sera affichée sur la page d’accueil." }
          - { label: Bio courte, name: bio, widget: text }
          - { label: Texte à propos, name: about, widget: text }
          - { label: Chemin du CV, name: cv, widget: string, required: false, hint: "Exemple : assets/cv/cv.pdf" }
          - label: Contacts
            name: contacts
            widget: list
            fields:
              - { label: Libellé, name: label, widget: string }
              - { label: Lien, name: url, widget: string }
      - label: Compétences principales
        name: skills
        file: assets/data/skills.json
        format: json
        fields:
          - label: Liste des compétences
            name: items
            widget: list
            fields:
              - { label: Titre, name: title, widget: string }
              - { label: Description, name: description, widget: text }
      - label: Certifications et badges
        name: certifications
        file: assets/data/certifications.json
        format: json
        fields:
          - label: Liste des éléments
            name: items
            widget: list
            fields:
              - label: Type
                name: type
                widget: select
                options:
                  - { label: Vraie certification, value: certification }
                  - { label: Badge, value: badge }
              - { label: Nom de la certification ou du badge, name: title, widget: string }
              - { label: Organisme émetteur, name: issuer, widget: string }
              - label: Statut
                name: status
                widget: select
                options:
                  - Obtenue
                  - En préparation
                  - En apprentissage
                  - Objectif
              - { label: Date ou année, name: date, widget: string, required: false }
              - { label: Image de la preuve, name: image, widget: image, required: false }
              - { label: Lien de vérification, name: credentialUrl, widget: string, required: false, hint: "Le site affiche ce lien quand il est renseigné." }
              - { label: Description, name: description, widget: text }
              - label: Compétences liées
                name: skills
                widget: list
                required: false
                field: { label: Compétence, name: skill, widget: string }
      - label: Projets affichés sur le site
        name: projects_site_source
        file: content/projects/project-control.json
        format: json
        fields:
          - label: Projets
            name: items
            widget: list
            fields:
              - { label: Titre source, name: title, widget: string, hint: "Titre lié au fichier Markdown. Évite de le modifier si le fichier existe déjà." }
              - { label: Titre public personnalisé, name: publicTitle, widget: string, required: false, hint: "Titre affiché sur le site. Peut être modifié sans casser le fichier Markdown." }
              - { label: Chemin Obsidian / Markdown, name: obsidianPath, widget: string, required: false }
              - { label: Catégorie, name: category, widget: string, required: false }
              - label: Statut
                name: status
                widget: select
                required: false
                options:
                  - En cours
                  - Terminé
                  - En amélioration
                  - À documenter
              - label: Outils utilisés
                name: tools
                widget: list
                required: false
                field: { label: Outil, name: tool, widget: string }
              - label: Compétences acquises
                name: skills
                widget: list
                required: false
                hint: "Ces compétences remontent dans l’onglet Compétences démontrées."
                field: { label: Compétence, name: skill, widget: string }
              - { label: Publier sur le site, name: publish, widget: boolean, default: false }
              - { label: Note interne, name: note, widget: text, required: false }
      - label: Writeups affichés sur le site
        name: writeups_site_source
        file: content/writeups/writeups.json
        format: json
        fields:
          - label: Writeups
            name: items
            widget: list
            fields:
              - { label: Type, name: type, widget: string, required: false }
              - { label: Section technique, name: section, widget: string, required: false }
              - label: Section affichée
                name: sectionLabel
                widget: select
                options:
                  - Challenges
                  - Machine/Lab
              - { label: Plateforme, name: platform, widget: string }
              - { label: Catégorie, name: category, widget: string }
              - { label: Titre, name: title, widget: string }
              - { label: Statut, name: status, widget: string, required: false }
              - { label: Difficulté, name: difficulty, widget: string, required: false }
              - label: Compétences acquises
                name: skills
                widget: list
                required: false
                field: { label: Compétence, name: skill, widget: string }
              - label: Tags
                name: tags
                widget: list
                required: false
                field: { label: Tag, name: tag, widget: string }
              - { label: Description, name: description, widget: text, required: false }
              - { label: Chemin du fichier Markdown, name: path, widget: string }
  - name: project_publication
    label: Publication Projets Obsidian
    label_singular: Projet à valider
    folder: content/projects-control
    create: false
    extension: json
    format: json
    identifier_field: title
    summary: "{{title}} — {{publish}}"
    fields:
      - { label: Titre détecté, name: title, widget: string, hint: "Titre automatiquement basé sur le nom du fichier Obsidian. À éviter de modifier." }
      - { label: Titre public personnalisé, name: publicTitle, widget: string, required: false, hint: "Optionnel. Le site utilise ce titre seulement pour l’affichage." }
      - { label: Chemin détecté automatiquement, name: obsidianPath, widget: string, hint: "Ne pas modifier. Ce chemin vient automatiquement du dossier PROJET." }
      - { label: Catégorie, name: category, widget: string, required: false }
      - label: Statut
        name: status
        widget: select
        required: false
        options:
          - En cours
          - Terminé
          - En amélioration
          - À documenter
      - label: Outils utilisés
        name: tools
        widget: list
        required: false
        field: { label: Outil, name: tool, widget: string }
      - label: Compétences acquises
        name: skills
        widget: list
        required: false
        hint: "Ces compétences seront ajoutées automatiquement dans l’onglet Compétences."
        field: { label: Compétence, name: skill, widget: string }
      - { label: Publier sur le site, name: publish, widget: boolean, default: false }
      - { label: Note interne, name: note, widget: text, required: false }
  - name: writeup_publication
    label: Publication Writeups Obsidian
    label_singular: Writeup à valider
    folder: content/writeups-control
    create: false
    extension: json
    format: json
    identifier_field: title
    summary: "{{sectionLabel}} / {{platform}} / {{category}} — {{title}} — {{publish}}"
    fields:
      - { label: Titre détecté, name: title, widget: string }
      - { label: Titre public personnalisé, name: publicTitle, widget: string, required: false }
      - { label: Chemin détecté automatiquement, name: obsidianPath, widget: string }
      - { label: Sous-section détectée, name: sectionLabel, widget: string, required: false }
      - { label: Plateforme détectée, name: platform, widget: string, required: false }
      - { label: Catégorie détectée, name: category, widget: string, required: false }
      - label: Compétences acquises
        name: skills
        widget: list
        required: false
        field: { label: Compétence, name: skill, widget: string }
      - { label: Publier sur le site, name: publish, widget: boolean, default: false }
      - { label: Note interne, name: note, widget: text, required: false }
  - name: articles
    label: Articles
    files:
      - label: Liste des articles
        name: articles
        file: assets/data/articles.json
        format: json
        fields:
          - label: Articles
            name: items
            widget: list
            fields:
              - { label: Titre, name: title, widget: string }
              - { label: Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
              - { label: Résumé, name: summary, widget: text }
              - { label: Lien, name: url, widget: string, required: false }
