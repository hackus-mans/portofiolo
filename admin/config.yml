backend:
  name: github
  repo: hackus-mans/portofiolo
  branch: main

media_folder: assets/uploads
public_folder: /portofiolo/assets/uploads

collections:
  - name: settings
    label: Paramètres du site
    files:
      - label: Profil
        name: profile
        file: assets/data/profile.json
        format: json
        fields:
          - { label: Nom, name: name, widget: string }
          - { label: Titre, name: title, widget: string }
          - { label: Bio courte, name: bio, widget: text }
          - { label: Texte à propos, name: about, widget: text }
          - { label: Chemin du CV, name: cv, widget: string, required: false }
          - label: Contacts
            name: contacts
            widget: list
            fields:
              - { label: Libellé, name: label, widget: string }
              - { label: Lien, name: url, widget: string }
      - label: Compétences
        name: skills
        file: assets/data/skills.json
        format: json
        fields:
          - label: Liste des compétences
            name: items
            widget: list
            fields:
              - { label: Titre, name: title, widget: string }
              - { label: Description, name: description, widget: text }
      - label: Certifications et badges
        name: certifications
        file: assets/data/certifications.json
        format: json
        fields:
          - label: Liste des éléments
            name: items
            widget: list
            fields:
              - label: Type
                name: type
                widget: select
                options:
                  - { label: Vraie certification, value: certification }
                  - { label: Badge, value: badge }
              - { label: Nom de la certification ou du badge, name: title, widget: string }
              - { label: Organisme émetteur, name: issuer, widget: string }
              - label: Statut
                name: status
                widget: select
                options:
                  - Obtenue
                  - En préparation
                  - En apprentissage
                  - Objectif
              - { label: Date ou année, name: date, widget: string, required: false }
              - { label: Image de la preuve, name: image, widget: image, required: false }
              - { label: Lien de vérification, name: credentialUrl, widget: string, required: false }
              - { label: Description, name: description, widget: text }
              - label: Compétences liées
                name: skills
                widget: list
                field: { label: Compétence, name: skill, widget: string }

  - name: project_publication
    label: Publication Projets Obsidian
    files:
      - label: Choisir les projets à publier
        name: project_control
        file: content/projects/project-control.json
        format: json
        fields:
          - label: Projets détectés automatiquement depuis Obsidian
            name: items
            widget: list
            summary: "{{fields.title}} — {{fields.publish}}"
            fields:
              - { label: Titre détecté, name: title, widget: string, hint: "Titre automatiquement basé sur le nom du fichier Obsidian. À éviter de modifier." }
              - { label: Titre public personnalisé, name: publicTitle, widget: string, required: false, hint: "Optionnel. Remplis seulement si tu veux afficher un titre différent sur le site." }
              - { label: Chemin détecté automatiquement, name: obsidianPath, widget: string, hint: "Ne pas modifier. Ce chemin vient automatiquement du dossier PROJET." }
              - { label: Catégorie, name: category, widget: string, required: false }
              - label: Statut
                name: status
                widget: select
                required: false
                options:
                  - En cours
                  - Terminé
                  - En amélioration
                  - À documenter
              - label: Outils utilisés
                name: tools
                widget: list
                required: false
                field: { label: Outil, name: tool, widget: string }
              - label: Compétences acquises
                name: skills
                widget: list
                required: false
                hint: "Ces compétences seront ajoutées automatiquement dans l’onglet Compétences."
                field: { label: Compétence, name: skill, widget: string }
              - { label: Publier sur le site, name: publish, widget: boolean, default: false }
              - { label: Note interne, name: note, widget: text, required: false }

  - name: projects
    label: Projets manuels
    label_singular: Projet manuel
    folder: content/projects
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - label: Outils utilisés
        name: tools
        widget: list
        required: false
        hint: "Exemple : Python, Nmap, Wireshark, Django, Wazuh..."
        field: { label: Outil, name: tool, widget: string }
      - label: Compétences acquises
        name: skills
        widget: list
        required: false
        hint: "Ces compétences seront ajoutées automatiquement dans l’onglet Compétences."
        field: { label: Compétence, name: skill, widget: string }
      - label: Statut
        name: status
        widget: select
        required: false
        options:
          - En cours
          - Terminé
          - En amélioration
          - À documenter
      - { label: Catégorie, name: category, widget: string, required: false, hint: "Exemple : Offensive Security, Defensive Security, AI + Cybersecurity, Web Security" }
      - label: Documentation du projet
        name: body
        widget: markdown
        hint: "Écris ici ton projet comme dans Obsidian. Le site affiche le titre du fichier comme titre principal."

  - name: writeup_publication
    label: Publication Writeups Obsidian
    files:
      - label: Choisir les writeups à publier
        name: publication_control
        file: content/writeups/publication-control.json
        format: json
        fields:
          - label: Notes détectées automatiquement depuis Obsidian
            name: items
            widget: list
            summary: "{{fields.sectionLabel}} / {{fields.platform}} / {{fields.category}} — {{fields.title}} — {{fields.publish}}"
            fields:
              - { label: Titre détecté, name: title, widget: string, hint: "Titre automatiquement basé sur le nom du fichier Obsidian. À éviter de modifier." }
              - { label: Titre public personnalisé, name: publicTitle, widget: string, required: false, hint: "Optionnel. Remplis seulement si tu veux afficher un titre différent sur le site." }
              - { label: Chemin détecté automatiquement, name: obsidianPath, widget: string, hint: "Ne pas modifier. Ce chemin vient automatiquement du dossier Pratique." }
              - { label: Sous-section détectée, name: sectionLabel, widget: string, required: false }
              - { label: Plateforme détectée, name: platform, widget: string, required: false }
              - { label: Catégorie détectée, name: category, widget: string, required: false }
              - label: Compétences acquises
                name: skills
                widget: list
                required: false
                hint: "Ces compétences seront ajoutées automatiquement dans l’onglet Compétences."
                field: { label: Compétence, name: skill, widget: string }
              - { label: Publier sur le site, name: publish, widget: boolean, default: false }
              - { label: Note interne, name: note, widget: text, required: false }

  - name: realisations
    label: Writeups et Labs manuels
    files:
      - label: Writeups et Labs manuels
        name: realisations
        file: assets/data/realisations.json
        format: json
        fields:
          - label: Liste des éléments
            name: items
            widget: list
            summary: "{{fields.title}} — {{fields.type}}"
            fields:
              - label: Type
                name: type
                widget: select
                options:
                  - { label: Writeup, value: writeup }
                  - { label: Lab, value: lab }
              - { label: Titre, name: title, widget: string }
              - { label: Catégorie, name: category, widget: string }
              - label: Niveau
                name: level
                widget: select
                options:
                  - Débutant
                  - Intermédiaire
                  - Avancé
                  - À définir
              - label: Statut
                name: status
                widget: select
                options:
                  - En cours
                  - Terminé
                  - En amélioration
                  - À documenter
                  - Modèle
              - { label: Description courte, name: description, widget: text }
              - { label: Objectif, name: objective, widget: text }
              - label: Compétences acquises
                name: skills
                widget: list
                required: false
                field: { label: Compétence, name: skill, widget: string }
              - label: Documentation complète
                name: documentation
                widget: markdown
                required: false

  - name: articles
    label: Articles
    files:
      - label: Liste des articles
        name: articles
        file: assets/data/articles.json
        format: json
        fields:
          - label: Articles
            name: items
            widget: list
            fields:
              - { label: Titre, name: title, widget: string }
              - { label: Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
              - { label: Résumé, name: summary, widget: text }
              - { label: Lien, name: url, widget: string, required: false }
